name: Refresh animated profile cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub profile and contribution calendar
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROFILE_TOKEN }}
          script: |
            const query = `
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  name
                  avatarUrl(size: 256)
                  contributionsCollection(from: $from, to: $to) {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays { date contributionCount }
                      }
                    }
                    hasAnyRestrictedContributions
                    restrictedContributionsCount
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions
                  }
                }
              }`;
            const to = new Date();
            const from = new Date(to.getTime() - 365 * 24 * 60 * 60 * 1000);
            const iso = d => d.toISOString();
            const result = await github.graphql(query, {
              login: context.repo.owner,
              from: iso(from),
              to: iso(to)
            });
            const user = result.user;
            const calendar = user.contributionsCollection.contributionCalendar;
            const days = calendar.weeks.flatMap(w => w.contributionDays);
            const payload = {
              generated_at: to.toISOString(),
              profile: { name: user.name || "Qadir Bux", avatar_url: user.avatarUrl },
              total_contributions: calendar.totalContributions,
              has_restricted_contributions: user.contributionsCollection.hasAnyRestrictedContributions,
              restricted_contributions_count: user.contributionsCollection.restrictedContributionsCount,
              total_commit_contributions: user.contributionsCollection.totalCommitContributions,
              total_issue_contributions: user.contributionsCollection.totalIssueContributions,
              total_pull_request_contributions: user.contributionsCollection.totalPullRequestContributions,
              total_pull_request_review_contributions: user.contributionsCollection.totalPullRequestReviewContributions,
              weeks: calendar.weeks,
              days
            };
            core.info("Contribution diagnostics: " + JSON.stringify({
              total: payload.total_contributions,
              hasRestricted: payload.has_restricted_contributions,
              restrictedCount: payload.restricted_contributions_count,
              commits: payload.total_commit_contributions,
              issues: payload.total_issue_contributions,
              pullRequests: payload.total_pull_request_contributions,
              reviews: payload.total_pull_request_review_contributions
            }));
            const fs = require("fs");
            fs.mkdirSync("data", { recursive: true });
            fs.writeFileSync("data/contributions.json", JSON.stringify(payload, null, 2) + "\n");

      - name: Install SVG font tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install fonttools brotli

      - name: Validate renderer syntax
        run: python -m py_compile scripts/render_cards.py

      - name: Render animated profile cards
        run: python scripts/render_cards.py

      - name: Validate generated SVG cards
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          cards = pathlib.Path("cards")
          required = [
              "hero.svg", "heatmap.svg", "activity.svg",
              "build.svg", "brand.svg", "learn.svg",
              "title-coding-dark.svg", "title-coding-light.svg",
              "repo-1.svg", "repo-2.svg", "repo-3.svg",
          ]
          for name in required:
              path = cards / name
              if not path.exists():
                  raise SystemExit(f"Missing generated card: {path}")
              ET.parse(path)
              print(f"OK {path}")
          PY

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated profile cards"
            git push
          fi
